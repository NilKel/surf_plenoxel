# run: conda env create -f environment.yml
name: plenoxel
channels:
  - pytorch
  - defaults
dependencies:
  - python=3.10.8
  - pip
  - numpy
  - tqdm
  - pip:
      - --pre
      - --extra-index-url https://download.pytorch.org/whl/nightly/cu128
      - torch
      - torchvision
      - imageio
      - imageio-ffmpeg
      - ipdb
      - lpips
      - opencv-python>=4.4.0
      - Pillow>=7.2.0
      - pyyaml>=5.3.1
      - tensorboard>=2.4.0
      - pymcubes
      - moviepy
      - matplotlib
      - scipy>=1.6.0

